interface:
  display_name: "Travel Guide PWA Builder"
  short_description: "Plan and build field-ready offline travel PWAs with ChatGPT Sites"
  default_prompt: "Use $travel-guide-pwa-builder to plan, build, or update a sourced, destination-themed travel PWA. If I only provide a rough trip idea, use planning mode with no more than five compact decision stages and a bounded feasibility check before delivering the first guide. Optimize field use around the current stage, next action, hard deadline, executable transfers and Plan B. Use the official Sites workflow for hosting, separate public content from optional personal member data, validate mobile, print, themes, navigation, updates and offline behavior, and respect publication approval."
