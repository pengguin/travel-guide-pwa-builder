<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">旅行路书 PWA 脱敏中文 Demo</title>
  <desc id="desc">从一句话规划输入，到现场首页和逐日执行页的三联示意截图。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#082d36" flood-opacity=".18"/></filter>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
      .cap{font-size:18px;font-weight:800;letter-spacing:3px;fill:#d99b35}.title{font-size:30px;font-weight:800;fill:#fff}.body{font-size:17px;fill:#173b42}.muted{font-size:14px;fill:#687c79}.label{font-size:12px;font-weight:800;letter-spacing:1px;fill:#6d7f7b}.strong{font-size:18px;font-weight:800;fill:#173b42}.small{font-size:12px;fill:#687c79}.white{fill:#fff}.gold{fill:#d99b35}.nav{font-size:12px;fill:#d7e4e3}.button{font-size:15px;font-weight:800;fill:#fff}
    </style>
  </defs>
  <rect width="1200" height="760" rx="28" fill="#f3ecdf"/>
  <text x="54" y="60" class="cap">ONE IDEA → FIELD-READY GUIDE</text>
  <text x="54" y="102" font-size="30" font-weight="800" fill="#113a45">一句话规划，也能交付现场可执行的离线路书</text>
  <text x="54" y="132" class="muted">合成示例 · 所有地点、日期与交通均为虚构</text>

  <g transform="translate(54 170)" filter="url(#shadow)">
    <rect width="330" height="520" rx="28" fill="#fffdf8"/>
    <rect width="330" height="122" rx="28" fill="#0c3947"/><rect y="92" width="330" height="30" fill="#0c3947"/>
    <text x="24" y="36" class="cap">PLANNING</text><text x="24" y="79" class="title">规划模式</text><text x="24" y="104" font-size="14" fill="#c7d8d9">无需先写完整逐日安排</text>
    <text x="24" y="160" class="label">你的输入</text>
    <rect x="20" y="178" width="290" height="78" rx="16" fill="#eef4f0"/>
    <text x="38" y="208" class="body">“国庆去山海环线自驾，</text><text x="38" y="235" class="body">节奏轻松，帮我做成路书。”</text>
    <text x="24" y="292" class="label">最多 5 个决策阶段</text>
    <g class="body">
      <circle cx="35" cy="326" r="13" fill="#d99b35"/><text x="31" y="332" class="white" font-size="13">1</text><text x="58" y="332">时间、人数与交通约束</text>
      <circle cx="35" cy="370" r="13" fill="#d99b35"/><text x="31" y="376" class="white" font-size="13">2</text><text x="58" y="376">必去重点与旅行节奏</text>
      <circle cx="35" cy="414" r="13" fill="#d99b35"/><text x="31" y="420" class="white" font-size="13">3</text><text x="58" y="420">预算、舒适度与隐私</text>
    </g>
    <rect x="20" y="460" width="290" height="42" rx="12" fill="#0c3947"/><text x="90" y="487" class="button">生成可用初版 →</text>
  </g>

  <g transform="translate(435 170)" filter="url(#shadow)">
    <rect width="330" height="520" rx="28" fill="#f8f3e9"/>
    <rect width="330" height="171" rx="28" fill="#0c3947"/><rect y="141" width="330" height="30" fill="#0c3947"/>
    <text x="22" y="34" class="cap">TODAY</text><text x="22" y="73" class="title">示例山海环线</text><text x="22" y="99" font-size="14" fill="#c7d8d9">现场 10 秒可读 · D3</text>
    <rect x="20" y="118" width="290" height="38" rx="10" fill="#f3dfb9"/><text x="35" y="143" class="strong">旅程第 3 天 · 山谷镇</text>
    <text x="22" y="205" class="label">我现在该做什么？</text>
    <rect x="20" y="220" width="290" height="118" rx="16" fill="#fff" stroke="#dccdb4"/>
    <text x="38" y="249" class="small">当前</text><text x="105" y="249" class="strong">山谷镇民宿</text>
    <text x="38" y="279" class="small">下一步</text><text x="105" y="279" class="body">08:20 出发去北门</text>
    <text x="38" y="309" class="small">硬时限</text><text x="105" y="309" class="strong" fill="#b84d3f">09:00 预约入场</text>
    <text x="22" y="373" class="label">下一段交通</text>
    <rect x="20" y="389" width="290" height="68" rx="15" fill="#e2f1ee"/>
    <text x="38" y="417" class="strong">民宿 → 北门</text><text x="38" y="442" class="muted">包车 · 约 25–35 分钟</text>
    <rect x="0" y="474" width="330" height="46" fill="#0c3947"/>
    <text x="27" y="503" class="nav">首页</text><text x="87" y="503" class="nav">行程</text><text x="149" y="503" class="nav">地图</text><text x="210" y="503" class="nav">深导</text><text x="270" y="503" class="nav">我的</text>
  </g>

  <g transform="translate(816 170)" filter="url(#shadow)">
    <rect width="330" height="520" rx="28" fill="#fffdf8"/>
    <rect width="330" height="122" rx="28" fill="#0c3947"/><rect y="92" width="330" height="30" fill="#0c3947"/>
    <text x="24" y="36" class="cap">DAY BY DAY</text><text x="24" y="78" class="title">D3 · 山谷镇</text><text x="24" y="104" font-size="14" fill="#c7d8d9">转场优先，不堆叠景点</text>
    <text x="22" y="157" class="label">TIMELINE</text>
    <line x1="42" y1="174" x2="42" y2="309" stroke="#d3c4a8" stroke-width="3"/>
    <circle cx="42" cy="184" r="7" fill="#d99b35"/><text x="64" y="190" class="strong">08:20 离开民宿</text><text x="64" y="212" class="small">取水、确认司机与天气</text>
    <circle cx="42" cy="246" r="7" fill="#d99b35"/><text x="64" y="252" class="strong">09:00 预约入场</text><text x="64" y="274" class="small">逾时改走南门 Plan B</text>
    <circle cx="42" cy="308" r="7" fill="#d99b35"/><text x="64" y="314" class="strong">12:00 午饭与缓冲</text>
    <text x="22" y="357" class="label">TRANSPORT BOX</text>
    <rect x="20" y="372" width="290" height="95" rx="15" fill="#eef4f0" stroke="#c7d8d1"/>
    <text x="37" y="400" class="small">From / To</text><text x="118" y="400" class="body">民宿 → 北门</text>
    <text x="37" y="427" class="small">建议 / 最晚</text><text x="118" y="427" class="strong">08:20 / 08:35</text>
    <text x="37" y="452" class="small">Plan B</text><text x="118" y="452" class="body">晚点改走南门</text>
    <rect x="20" y="482" width="138" height="30" rx="10" fill="#ece5d8"/><text x="48" y="503" class="body">← 前一天</text>
    <rect x="172" y="482" width="138" height="30" rx="10" fill="#0c3947"/><text x="202" y="503" class="button">下一天 →</text>
  </g>
</svg>
