<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Synthetic interaction architecture</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eff3f4;color:#153e50;font-family:Arial,"PingFang SC",sans-serif}.shot-interaction{width:1600px;height:1000px;padding:48px 64px 64px;position:relative}.eyebrow{font-size:18px;letter-spacing:3px;color:#587986;font-weight:700}h1{font-size:42px;margin:14px 0 12px}header p{font-size:23px;color:#597580;margin:0}.columns{display:grid;grid-template-columns:1fr 1fr;gap:36px;margin-top:34px}.panel{background:white;border:1px solid #c5d3d9;border-radius:22px;overflow:hidden;min-width:0}.bar{background:#103d50;color:white;padding:24px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:93px}.bar h2{font-size:27px;margin:0}.pill{font-size:17px;white-space:nowrap;border-radius:20px;padding:7px 13px;background:#d8edf3;color:#1c5b71}.body{padding:26px}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:16px}.tile{min-height:101px;background:#f1f6f8;border:1px solid #bdcfd7;border-radius:12px;padding:20px;font-size:23px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:12px}.note{margin:24px 0 0;font-size:21px;line-height:1.5;color:#5a747e}.detail{border:1px solid #bdd1d8;border-radius:12px;padding:20px;margin-top:20px}.detail h3{font-size:23px;margin:0 0 14px}.row{font-size:21px;border-top:1px solid #d5e0e4;padding-top:14px;display:flex;align-items:center;gap:14px}.box{width:22px;height:22px;border:2px solid #326c83;border-radius:4px;flex-shrink:0}.account{background:#f1f6f8;border-radius:12px;padding:20px;font-size:21px}.account strong{font-size:23px;display:block;margin-bottom:8px}.record{padding:22px 0;border-bottom:1px solid #d5e0e4;display:flex;justify-content:space-between;font-size:22px;gap:12px}.status{background:#e8f4ec;color:#285b40;padding:16px 18px;border-radius:10px;font-size:21px;line-height:1.45;margin-top:24px}.footer{position:absolute;left:64px;right:64px;bottom:28px;font-size:16px;letter-spacing:.6px;color:#587986;border-top:1px solid #c6d4da;padding-top:15px}.caption{font-size:17px;color:#607c87;margin-top:20px;line-height:1.45}
</style>
<main class="shot-interaction">
<header><div class="eyebrow" data-i="eyebrow"></div><h1 data-i="title"></h1><p data-i="subtitle"></p></header>
<div class="columns">
<section class="panel"><div class="bar"><h2 data-i="tools"></h2><span class="pill" data-i="public"></span></div><div class="body">
<div class="tiles"><div class="tile"><span data-i="prep"></span>→</div><div class="tile"><span data-i="packing"></span>→</div><div class="tile"><span data-i="budget"></span>→</div><div class="tile"><span data-i="help"></span>→</div></div>
<p class="note" data-i="toolNote"></p><div class="detail"><h3 data-i="inside"></h3><div class="row"><span class="box"></span><span data-i="task"></span></div></div><p class="caption" data-i="menuNote"></p>
</div></section>
<section class="panel"><div class="bar"><h2 data-i="my"></h2><span class="pill" data-i="offline"></span></div><div class="body">
<div class="account"><strong data-i="account"></strong><span data-i="prior"></span></div>
<div class="record"><span data-i="tickets"></span><span data-i="read"></span></div><div class="record"><span data-i="stays"></span><span data-i="read"></span></div><div class="record"><span data-i="sync"></span><span data-i="pending"></span></div>
<div class="status" data-i="status"></div><p class="caption" data-i="limit"></p>
</div></section>
</div><footer class="footer" data-i="footer"></footer>
</main>
<script>
const copy={en:{eyebrow:'INTERACTION CONTRACT · SYNTHETIC EXAMPLE',title:'Clear task ownership. Useful offline reading.',subtitle:'Public utilities and previously authorized personal records have different boundaries.',tools:'Tools',public:'Public utilities',prep:'Preparation',packing:'Packing',budget:'Budget',help:'Emergency',toolNote:'Independent tasks open a page. Related details expand inside the task.',inside:'Inside Preparation · Checklist −',task:'Save the public route for offline reading',menuNote:'Illustrative menu only; adapt categories and counts to the trip.',my:'My records',offline:'Offline',account:'Demo member · Account',prior:'Previously authorized on this device',tickets:'Transport records',stays:'Booked stays',read:'Read locally',sync:'Cloud synchronization',pending:'Unavailable offline',status:'A valid local grant keeps downloaded records readable when the network fails.',limit:'First authentication needs a server. Sign-out, local expiry and confirmed revocation invalidate access.',footer:'SYNTHETIC UI ILLUSTRATION · NOT A LIVE APP · NO MEMBER BACKEND IN THE STATIC STARTER'},zh:{eyebrow:'交互约定 · 虚构示例',title:'任务入口清晰，离线资料仍可读取',subtitle:'公共工具与先前授权下载的个人资料，采用不同的数据边界。',tools:'工具',public:'公共工具',prep:'行前准备',packing:'行李清单',budget:'预算',help:'应急信息',toolNote:'独立任务进入二级页面；相关细节在任务内展开。',inside:'行前准备内 · 检查清单 −',task:'保存公共路线以便离线阅读',menuNote:'菜单仅为示意；类别与数量按旅程需要调整。',my:'我的资料',offline:'离线',account:'示例成员 · 账号',prior:'曾在本设备完成授权',tickets:'交通票记录',stays:'已订住宿',read:'本机可读',sync:'云端同步',pending:'离线时不可用',status:'本机授权仍有效时，网络失败不应阻断已下载资料的阅读。',limit:'首次认证需要联网；退出、本机授权到期或确认撤销后停止访问。',footer:'虚构界面示意 · 非实际应用截图 · 静态起步模板不包含成员后端'}};
const lang=new URLSearchParams(location.search).get('lang')==='zh'?'zh':'en';document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.querySelectorAll('[data-i]').forEach(el=>el.textContent=copy[lang][el.dataset.i]);
</script></html>
